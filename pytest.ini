[pytest]
# Collect tests only from tests/ (tests/manual/verification scripts are run by
# hand because they execute at import time and call sys.exit).
testpaths = tests

# Put the project root on sys.path so tests can `from src... import ...`
# without installing the package. `pythonpath` is provided by pytest itself
# (pytest >= 7); no plugin installation is required.
pythonpath = .
